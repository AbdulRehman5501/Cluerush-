.code{font-size:3rem;font-weight:800;letter-spacing:.18em}
.list{display:grid;gap:8px;width:100%}

.spacer{flex:1}

.logo span{display:block;color:var(--muted);margin-top:8px}

.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1E1B3A;flex:none}
.wait{text-align:center}
.wait .d{display:inline-block;margin:0 2px}

const FB="Coffee/Tea,Pizza/Burger,Cat/Dog,Beach/Pool,Guitar/Violin,Train/Bus,Apple/Pear,Sun/Moon,Doctor/Nurse,Lion/Tiger,Pen/Pencil,Rain/Snow,Car/Motorbike,Milk/Yogurt,Hotel/Hostel,Shark/Dolphin,Soup/Stew,Laptop/Tablet,River/Lake,Bread/Cake,Wolf/Fox,Mango/Banana,Tent/Cabin,Rose/Tulip,Whale/Seal,Castle/Palace,Wallet/Purse,Bakery/Cafe,Jacket/Coat,Desert/Savanna,Candle/Lamp,Truck/Van,Honey/Jam,Sandwich/Wrap,Gold/Silver,Violin/Cello,Tomato/Potato,Boat/Ship,Chess/Checkers,Sword/Dagger,Cinema/Theatre,Pancake/Waffle,Comet/Meteor,Owl/Eagle,Bridge/Tunnel,Football/Cricket,Muffin/Cupcake,Scarf/Shawl,Tractor/Bulldozer,Island/Peninsula,Poet/Author,Camel/Llama,Ice cream/Frozen yogurt,Hammer/Mallet,Oven/Microwave,Spoon/Fork,Sofa/Chair".split(",").map(s=>s.split("/"));
const THEMES="food,animals,sports,jobs,travel,home,school,music,nature,tech,clothes,drinks,transport,movies,games,weather,tools,fruit,places".split(",");
const $=document.getElementById("app");
let db,user,sample,uid,code=null,R=null,P={},unsubs=[],ready=false,err="",lastKey="",draft="",codeIn="",starting=false;
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const tsms=v=>v&&v.toMillis?v.toMillis():(v||0);

let chat=[],cdraft="";
const H={};"Coffee|hot dark morning drink|subah ki garam kaali cheez;Tea|hot drink often with milk|dudh wali garam cheez;Pizza|round with cheese on top|gol hota hai, upar cheese;Burger|bun with a patty inside|bun ke andar tikki hoti hai;Cat|says meow|ye meow karti hai;Dog|loyal and barks|wafadar hai aur bhonkta hai;Beach|sand and waves|ret aur lehrein;Pool|water you swim in|isme tairte hain;Guitar|strings you strum|taaron wala, ungliyon se bajta hai;Violin|played with a bow|kamaan se bajta hai;Train|runs on tracks|patriyon par chalti hai;Bus|carries many people on roads|sadak par bohat sawariyan;Apple|red or green fruit|laal ya hara phal;Pear|green fruit wider at the bottom|neeche se mota phal;Sun|gives light in the daytime|din mein roshni deta hai;Moon|shines at night|raat ko chamakta hai;Doctor|checks patients|mareez ko check karta hai;Nurse|cares for patients in hospital|hospital mein dekhbhal karti hai;Lion|king of the jungle|jungle ka badshah;Tiger|big cat with stripes|dhaariyon wala bada janwar;Pen|you write with ink|isse likhte hain;Pencil|you write and erase|likhte hain aur mita sakte hain;Rain|water falling from clouds|badal se paani girta hai;Snow|white and cold|safed aur thandi;Car|four wheels and an engine|chaar pahiye aur engine;Motorbike|two wheels and an engine|do pahiye aur engine;Milk|white drink from cows|safed cheez, gai se milti hai;Yogurt|thick and sour|gaadha aur khatta;Hotel|stay overnight and pay|raat guzarne ki jagah;Hostel|cheap shared rooms|saste, mil kar rehne wale kamre;Shark|dangerous sea hunter|samandar ka khatarnak shikari;Dolphin|smart sea animal that jumps|samandar ka samajhdar janwar;Soup|hot liquid in a bowl|piyale mein garam patla;Stew|thick slow-cooked dish|dheemi aanch par pakta gaadha saalan;Laptop|portable computer|uthane wala computer;Tablet|touch screen bigger than a phone|phone se bada touch screen;River|flowing water|behta hua paani;Lake|still water surrounded by land|tehra hua paani;Bread|baked slices|sek kar bani, slice const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
let botK="",bv={};
const isBot=i=>!!(P[i]&&P[i].bot);
const LINES=["Hmm, kiska hint thoda ajeeb tha?","Someone’s hint felt a bit off to me.","Hints ko dhyan se dekho, koi vague hai.","Who was the most vague one?"];
const CHATQ="\nWrite your next chat message: one short casual sentence (max 20 words), like a friend texting. Match the language the other players use (English or Roman Urdu); if nobody has spoken, mix Roman Urdu and English. Never say you are an AI. Output only the message.";
function botStep(){
  const k=key();
  if(R.phase==="hints"){
    const b=R.order[R.turn];
    if(!isBot(b)||P[b]["h"+k]!==undefined)return;
    const bk=k+"_"+R.turn;if(bk===botK)return;botK=bk;
    const w=R.imp===b?R.impw:R.civ,h=H[String(w).toLowerCase()],t=h?h[(R.round+R.game+R.turn)%2]:"I can’t say much about it";
    setTimeout(()=>db.doc(`rooms/${code}/players/${b}`).update({["h"+k]:cap(t)}).catch(()=>{}),3000);
  }else if(R.phase==="vote")R.order.filter(isBot).forEach(b=>botVote(b,k));
}
const nmb=(i,b)=>i===b?`${nm(i)} (you)`:nm(i);
function ctx(b){
  const k=key(),isImp=R.imp===b,w=isImp?R.impw:R.civ;
  const hs=R.order.map(i=>{const l=[];for(let r=1;r<=R.round;r++){const t=P[i]&&P[i]["h"+R.game+"_"+r];if(t!==undefined)l.push(`round ${r}: "${t}"`)}return `${nmb(i,b)}: ${l.join("; ")}`}).join("\n");
  const ch=chat.filter(x=>x.k===k).map(x=>`${nmb(x.u,b)}: ${x.m}`).join("\n")||"(nobody has spoken yet)";
  const role=isImp?`You are the IMPOSTER. Your word is "${w}", but the others have a similar, different word. Blend in, never reveal you are the imposter, never say your word outright, and subtly cast suspicion on another player.`:`You are a CREW member. Your word is "${w}". One player has a similar but different word. Work out who from their hints first; treat chat accusations with suspicion because the imposter may lie.`;

}
async function botVote(b,k){
  if(P[b]["v"+k]!==undefined)return;
  const now=Date.now();let s=bv[b];
  if(!s||s.k!==k)s=bv[b]={k,sent:0,seen:0,next:now+9000+Math.random()*9000,last:0,busy:false};
  if(s.busy)return;
  const humans=R.order.filter(i=>!isBot(i)),done=humans.every(i=>P[i]&&P[i]["v"+k]!==undefined);
  if(done||(R.deadline&&R.deadline-sNow()<25000)){s.busy=true;return castVote(b,k)}
  const msgs=chat.filter(x=>x.k===k&&x.u!==b).length;
  if(s.sent<4&&now>=s.next&&(msgs>s.seen||s.sent===0||now-s.last>40000)){
    s.busy=true;s.seen=msgs;
    const t=((await askAI(ctx(b)+CHATQ))||pick(LINES)).replace(/^"|"$/g,"").slice(0,120);
    if(code&&R&&R.phase==="vote"&&key()===k)await db.doc(`rooms/${code}/chat/${Date.now()}_${b}`).set({u:b,m:t,t:Date.now(),k}).catch(()=>{});

async function castVote(b,k){
  const isImp=R.imp===b,others=R.order.filter(i=>i!==b),byLen=[...others].sort((x,y)=>nm(y).length-nm(x).length);
  const a=await askAI(ctx(b)+`\nDecide mainly from whose hints do not fit your word. Players may accuse others in chat, but accusations can be lies (the imposter will lie), so never just follow them. Who do you think is the imposter? Reply with only one player's exact name from: ${others.map(nm).join(", ")}.${isImp?" You must pick someone other than yourself.":" Reply SKIP only if you really can't tell."}`);
  let v=a&&byLen.find(i=>a.toLowerCase().includes(nm(i).toLowerCase()));
  if(!v)v=(a&&!isImp&&/skip/i.test(a))?"skip":pick(others);
  db.doc(`rooms/${code}/players/${b}`).update({["v"+k]:v}).catch(()=>{});
}
setInterval(()=>{if(R&&code&&isLead()&&R.phase==="vote")botStep()},2500);

function chatUI(){const m=chat.filter(x=>x.k===key());return `<div class="rd"><p>Chat${aiErr?` (AI off: ${esc(aiErr)})`:""}</p>${m.map(x=>`<div class="hl"><b>${esc(nm(x.u))}</b><span>${esc(x.m)}</span></div>`).join("")}<div style="display:flex;gap:8px"><input id="cdraft" placeholder="Say something…" maxlength="120" value="${esc(cdraft)}" autocomplete="off"><button data-act="chat">Send</button></div></div>`}

async function makePair(){

    const a=String(v&&v.a||"").trim().slice(0,24),b=String(v&&v.b||"").trim().slice(0,24);
    if(a&&b&&a.toLowerCase()!==b.toLowerCase())return Math.random()<.5?[a,b]:[b,a];
  }catch(e){}}
  let p,n=0;do{p=pick(FB);n++}while((R.used||[]).includes(p.join("/"))&&n<50);
  return Math.random()<.5?p:[p[1],p[0]];
}

async function create(){
  if(!name.trim())return fail("Enter your name first.");
  const c=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
  try{await db.doc("rooms/"+c).set({host:uid,phase:"lobby",game:0,round:1,turn:0,order:[],used:[],at:Date.now()});await join(c)}catch(e){fail("Could not create the room.")}
}
async function join(c,quiet){
  c=c.toUpperCase().trim();
  if(!name.trim())return fail("Enter your name first.");
  try{
    const s=await db.doc("rooms/"+c).get();
    if(!s.exists){if(quiet)ls.set("imp-code","");else fail("Room not found. Check the code.");return}
    const pd=db.doc(`rooms/${c}/players/${uid}`),ps=await pd.get();
    if(ps.exists)await pd.update({name:name.trim().slice(0,16),seen:serverTimestamp()});else await pd.set({name:name.trim().slice(0,16),at:Date.now(),seen:serverTimestamp()});
    ls.set("imp-name",name.trim());ls.set("imp-code",c);code=c;err="";subscribe();
  }catch(e){fail("Could not join the room.")}
}
function subscribe(){
  unsubs.push(db.collection(`rooms/${code}/chat`).onSnapshot(q=>{chat=q.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);tick()}));
  unsubs.push(rdoc().onSnapshot(s=>{R=s.exists?s.data():null;tick()}));
  unsubs.push(db.collection(`rooms/${code}/players`).onSnapshot(q=>{P={};q.docs.forEach(d=>P[d.id]=d.data());const m=P[uid];if(m&&m.seen&&!m._p)off=tsms(m.seen)-Date.now();tick()}));
}
function leave(){
  unsubs.forEach(u=>u());unsubs=[];
  if(R&&(R.phase==="lobby"||R.phase==="result"))me().delete().catch(()=>{});
  code=null;R=null;P={};chat=[];lastKey="";ls.set("imp-code","");render();
}
function fail(m){err=m;render()}

function tick(){if(R&&isLead()){hostStep();botStep()}render()}
function hostStep(){
  const k=key(),kk=[k,R.phase,R.turn].join();
  if(kk===lastKey)return;
  if(R.phase==="hints"){
    const c=R.order[R.turn];
    if(P[c]&&P[c]["h"+k]!==undefined){lastKey=kk;rdoc().update(R.turn+1<R.order.length?{turn:R.turn+1,deadline:sNow()+HINT_MS}:{phase:"vote",deadline:sNow()+VOTE_MS})}
  }else if(R.phase==="vote"&&R.order.every(i=>P[i]&&P[i]["v"+k]!==undefined)){
    lastKey=kk;
    const c={};let skip=0;
    R.order.forEach(i=>{const v=P[i]["v"+k];if(v==="skip")skip++;else c[v]=(c[v]||0)+1});
    const top=Object.entries(c).sort((a,b)=>b[1]-a[1]),[tid,tn]=top[0]||[];
    if(!tid||skip>=tn||(top[1]&&top[1][1]===tn))rdoc().update({round:R.round+1,turn:0,phase:"hints",deadline:sNow()+HINT_MS,note:"No majority, so the vote was skipped. Give another hint."});
    else rdoc().update({phase:"result",accused:tid,winner:tid===R.imp?"crew":"imposter"});
  }
}
async function startGame(){
  const ids=Object.keys(P);if(ids.length<3||starting)return;
  starting=true;render();
  const pair=await makePair();
  await rdoc().update({phase:"hints",deadline:sNow()+HINT_MS,game:R.game+1,round:1,turn:0,order:shuffle(ids),imp:pick(ids),civ:pair[0],impw:pair[1],used:[...(R.used||[]).slice(-40),pair.join("/")],note:"",accused:"",winner:""});
  starting=false;
}

function role(){
  const imp=uid===R.imp;
  return `<div class="card ${imp?"imp":"word"}"><p>${imp?"You are the imposter":"Your word"}</p><div class="big">${esc(imp?R.impw:R.civ)}</div>${imp?"<p>Your word is close to theirs. Blend in and don’t get caught.</p>":""}</div>`;
}
function hints(){
  let h="";
  for(let r=1;r<=R.round;r++){
    const rows=R.order.map(i=>{const t=P[i]&&P[i]["h"+R.game+"_"+r];return t===undefined?"":`<div class="hl"><b>${esc(nm(i))}</b><span>${esc(t)}</span></div>`}).join("");
    if(rows)h+=`<div class="rd"><p>Round ${r}</p>${rows}</div>`;
  }
  return h;
}

const COL=["#FFC93C","#FF8FA3","#8FD3FF","#B8F2A0","#D5B3FF","#FFB27A"];
const logo=()=>`<div class="logo"><i aria-hidden="true">🕵️ 🔍 ❓</i><b>Clue Rush</b><span>Give clues. Find the imposter. <small style="opacity:.55">v7</small></span></div>`;
function render(){
  const f=document.activeElement&&document.activeElement.id,pos=f&&document.activeElement.selectionStart;
  $.innerHTML=body();
  if(f){const el=document.getElementById(f);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function body(){
  const e=err?`<p class="err">${esc(err)}</p>`:"";
  if(!ready)return `${logo()}<p>Connecting… If this stays here, check your internet and reload.</p>`;
  if(!code||!R)return `${logo()}<p>Play with friends on their own phones. Create a room and share the code.</p>
  <input id="name" placeholder="Your name" maxlength="16" value="${esc(name)}" autocomplete="off">
  <button class="main" data-act="create">Create room</button>
  <input id="codein" placeholder="Room code" maxlength="4" value="${esc(codeIn)}" autocomplete="off" autocapitalize="characters">
  <button class="ghost" data-act="join">Join room</button>${e}`;
  const ids=Object.keys(P).sort((a,b)=>P[a].at-P[b].at),isHost=isLead(),out=`<button class="ghost" data-act="leave">Leave room</button>`;
  if(R.phase==="lobby")return `${logo()}<div class="ticket"><p>Room code</p><div class="code">${code}</div><p style="letter-spacing:0;text-transform:none;font-size:.95rem">Friends open the same link and join with this code.</p></div><button class="ghost" data-act="share">Share code</button>
  <div class="list">${ids.map((i,x)=>`<div class="pl"><span style="display:flex;align-items:center;gap:10px"><span class="av" style="background:${COL[x%COL.length]}">${esc(nm(i).charAt(0).toUpperCase())}</span><b>${esc(nm(i))}${i===uid?" (you)":""}${P[i].bot?" 🤖":""}</b></span>${isHost&&i!==uid?`<button class="ghost x" data-act="kick" data-id="${i}" aria-label="Remove ${esc(nm(i))}">Remove</button>`:""}</div>`).join("")}</div>
  <p class="wait">${ids.length} in the room · waiting for players <span class="d">•</span><span class="d">•</span><span class="d">•</span></p><div class="spacer"></div>${isHost?`<div style="display:flex;gap:8px"><button class="ghost" data-act="addbot" style="flex:1">Add robot 🤖</button>${ids.some(i=>P[i].bot)?`<button class="ghost" data-act="rmbot" style="flex:1">Remove robot</button>`:""}</div><button class="main" data-act="start" ${ids.length<3||starting?"disabled":""}>${starting?"Picking words…":ids.length<3?"Need 3 players to start":"Start game"}</button>`:`<p>Waiting for ${esc(nm(lead()))} to start.</p>`}${e}${out}`;
  const inGame=R.order.includes(uid),k=key();
  if(!inGame)return `<div class="card"><p>A game is in progress</p><div class="big">You’ll join the next one</div></div>${out}`;
  if(R.phase==="hints"){
    const cur=R.order[R.turn],mine=cur===uid;
    return `${timer()}${role()}${R.note?`<p>${esc(R.note)}</p>`:""}${hints()}<div class="spacer"></div>
    ${mine?`<p>Your turn. Give a hint for your word.</p><input id="draft" placeholder="Your hint" maxlength="40" value="${esc(draft)}" autocomplete="off"><button class="main" data-act="hint">Send hint</button>`:`<p>Waiting for ${esc(nm(cur))}…</p>`}${out}`;
  }
  if(R.phase==="vote"){
    const mine=P[uid]&&P[uid]["v"+k],n=R.order.filter(i=>P[i]&&P[i]["v"+k]!==undefined).length;
    return `${timer()}${role()}${hints()}${chatUI()}<div class="spacer"></div>${mine!==undefined?`<p>Vote sent. Waiting for others (${n}/${R.order.length}).</p>`:`<p>Who is the imposter? Most votes decides.</p>
    <div class="list">${R.order.filter(i=>i!==uid).map(i=>`<button class="ghost" data-act="vote" data-id="${i}">${esc(nm(i))}</button>`).join("")}<button data-act="vote" data-id="skip">Skip vote</button></div>`}${out}`;
  }
  const won=R.winner==="crew";
  return `<div class="card ${won?"word":"imp"}"><p>${won?"Crew wins":"Imposter wins"}</p><div class="big">${esc(nm(R.accused))} was voted out</div><p>${won?"They were the imposter.":`The real imposter was ${esc(nm(R.imp))}.`}</p></div>
  <div class="hl"><b>Everyone else</b><span>${esc(R.civ)}</span></div><div class="hl"><b>Imposter</b><span>${esc(R.impw)}</span></div>
  <div class="spacer"></div>${isHost?`<button class="main" data-act="start" ${starting?"disabled":""}>${starting?"Picking words…":"Play again"}</button>`:`<p>Waiting for ${esc(nm(lead()))} to start the next game.</p>`}${out}`;
}

$.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;const a=b.dataset.act;
  try{
    if(a==="create")create();
    else if(a==="join")join(codeIn);
    else if(a==="leave")leave();
    else if(a==="start")startGame();
    else if(a==="kick")db.doc(`rooms/${code}/players/${b.dataset.id}`).delete();
    else if(a==="hint"){const t=draft.trim();if(!t)return;draft="";await me().update({["h"+key()]:t.slice(0,40)})}
    else if(a==="chat"){const t=cdraft.trim();if(!t)return;cdraft="";await db.doc(`rooms/${code}/chat/${Date.now()}_${uid}`).set({u:uid,m:t.slice(0,120),t:Date.now(),k:key()})}
    else if(a==="share"){const t=`Join my Clue Rush game! Room code: ${code}\n${location.href}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{})}
    else if(a==="addbot"){const ks=Object.keys(P);let n=1;while(P["robot"+n])n++;if(n<=6&&ks.length<12)await db.doc(`rooms/${code}/players/robot${n}`).set({name:`Robot ${n}`,bot:true,at:Date.now()})}
    else if(a==="rmbot"){const bs=Object.keys(P).filter(i=>P[i].bot).sort();if(bs.length)await db.doc(`rooms/${code}/players/${bs[bs.length-1]}`).delete()}
    else if(a==="vote")await me().update({["v"+key()]:b.dataset.id});
  }catch(e){fail("That didn’t go through. Try again.")}
});
$.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="name")name=t.value;
  else if(t.id==="codein"){codeIn=t.value.toUpperCase();t.value=codeIn}
  else if(t.id==="draft")draft=t.value;
  else if(t.id==="cdraft")cdraft=t.value;
});
$.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const b=ev.target.id==="cdraft"?"chat":ev.target.id==="draft"?"hint":null;if(b)document.querySelector(`[data-act="${b}"]`).click()});
</script>
</body>
</html>
